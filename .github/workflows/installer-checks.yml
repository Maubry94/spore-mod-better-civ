name: Installer checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/installers.py --check
      - run: python -m unittest discover -s tests -p test_installers.py -v
      - run: git diff --check
